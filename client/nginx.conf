# SPA 静态托管配置（nginxinc/nginx-unprivileged：以非 root 运行，监听 8080）
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # gzip：文本类资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 带内容哈希的构建产物：长期缓存
    # 注意：location 内出现 add_header 后不再继承 server 级头，需重复声明安全头
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # 入口页不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
