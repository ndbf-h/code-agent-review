services:
  db:
    image: postgres:16-alpine
    container_name: code-agent-review-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: code_agent_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d code_agent_review"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: code-agent-review-rabbitmq
    restart: unless-stopped
    # guest 账户仅允许 loopback 连接，跨容器访问必须使用独立账号
    environment:
      RABBITMQ_DEFAULT_USER: review
      RABBITMQ_DEFAULT_PASS: review
    ports:
      - "5672:5672"
      # 管理 UI: http://localhost:15672 (review/review)
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: code-agent-review-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/code_agent_review
      RABBITMQ_URL: amqp://review:review@rabbitmq:5672/
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: code-agent-review-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/code_agent_review
      RABBITMQ_URL: amqp://review:review@rabbitmq:5672/
    command: node dist/server/src/worker.js
    # 给进行中的任务留出收尾时间，超时后未 ack 消息会被 broker 重投
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_BASE: http://localhost:3001/api
    container_name: code-agent-review-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

  # ── 可观测性栈（可选）：docker compose --profile observability up -d 启动 ──
  # Langfuse v3 自托管（UI: http://localhost:3000），首次启动需在 UI 创建组织/项目并生成 API 密钥，
  # 然后把 pk-/sk- 填入 .env 的 LANGFUSE_PUBLIC_KEY/SECRET_KEY 并重启 server/worker。
  langfuse-db:
    profiles: ["observability"]
    image: postgres:16-alpine
    container_name: code-agent-review-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    profiles: ["observability"]
    image: clickhouse/clickhouse-server:24.12
    container_name: code-agent-review-langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-redis:
    profiles: ["observability"]
    image: redis:8-alpine
    container_name: code-agent-review-langfuse-redis
    restart: unless-stopped
    command: redis-server --appendonly no --requirepass langfuse123
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a langfuse123 ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-minio:
    profiles: ["observability"]
    image: minio/minio:latest
    container_name: code-agent-review-langfuse-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    command: server /data
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO 不自动建桶，Langfuse 事件上传依赖 langfuse 桶存在
  langfuse-minio-init:
    profiles: ["observability"]
    image: minio/mc:latest
    container_name: code-agent-review-langfuse-minio-init
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://langfuse-minio:9000 minio minio123456 &&
      mc mb local/langfuse --ignore-existing
      "

  langfuse-server:
    profiles: ["observability"]
    image: langfuse/langfuse:3
    container_name: code-agent-review-langfuse-server
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfuse123
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio123456
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: "code-agent-review-langfuse-salt"
      ENCRYPTION_KEY: "d4d8c4b1f4f0e0b0a0c8e4d2f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4"
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: code-agent-review-nextauth-secret
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

  # v3 异步架构：web 只接收事件入队（Redis/S3），worker 负责真正写入 ClickHouse——缺它 trace 永远不出现
  langfuse-worker:
    profiles: ["observability"]
    image: langfuse/langfuse-worker:3
    container_name: code-agent-review-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: langfuse123
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minio123456
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: "code-agent-review-langfuse-salt"
      ENCRYPTION_KEY: "d4d8c4b1f4f0e0b0a0c8e4d2f6a8b0c2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4"
      TELEMETRY_ENABLED: "false"

volumes:
  postgres-data:
  rabbitmq-data:
  langfuse-db-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
